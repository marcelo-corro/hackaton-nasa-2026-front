<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preaviso, riesgo de incendio por comuna y por celda</title>
  <meta name="description" content="Dónde se concentra el riesgo de incendio en tu comuna en el periodo que elijas, por qué, y qué hacer para bajarlo.">
  <link rel="icon" href="img/icono.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/plataforma.css">
</head>
<body>
  <a class="salto" href="#contenido">Saltar al contenido</a>

  <div class="app">
    <aside class="rail" aria-label="Navegación">
      <a class="marca" href="#" data-vista="pais" aria-label="Preaviso, mapa de Chile">
        <img class="logo-emblema" src="img/logo-emblema.png" alt="" width="839" height="658">
        <img class="logo-nombre" src="img/logo-nombre.png" alt="" width="1277" height="234">
      </a>
      <section class="rail-bloque" aria-labelledby="rail-h-t">
        <h2 class="rail-t" id="rail-h-t">Horizonte</h2>
        <div class="dias" id="rail-h" role="radiogroup" aria-labelledby="rail-h-t"></div>
        <p class="rail-periodo" id="rail-periodo"></p>
      </section>
      <section class="rail-bloque" aria-labelledby="rail-vis-t" hidden>
        <h2 class="rail-t" id="rail-vis-t">Modo visión</h2>
        <button type="button" class="vision-btn" id="vision-btn" data-vision aria-pressed="false">Incendios de ejemplo</button>
        <div class="dias" id="rail-dia" role="radiogroup" aria-label="Día de los incendios de ejemplo" hidden></div>
        <p class="rail-ej" id="rail-ej" hidden>Datos de ejemplo, no son del modelo.</p>
      </section>
      <nav class="rail-bloque arbol-caja" aria-label="Zonas">
        <h2 class="rail-t">Zona</h2>
        <button type="button" class="arbol-pais" data-vista="pais"><span>Chile</span><small>todo el país</small></button>
        <ul class="arbol" id="arbol"></ul>
      </nav>
      <div class="rail-pie">
        <a class="enlace" href="index.html">&larr; Sala de despacho (portada)</a>
        <button type="button" class="enlace" data-vista="metodologia">Metodología y fuentes</button>
        <p id="fuente-datos"></p>
        <p>Equipo AIVital, NASA Space Apps 2026. Límites comunales: Biblioteca del Congreso Nacional de Chile.</p>
      </div>
    </aside>

    <main id="contenido" tabindex="-1">
      <p class="cargando">Cargando…</p>
    </main>
  </div>

<script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>

</html>
