<title>Preaviso</title>
<!-- Enlace de la primera versión del sitio (plataforma.html#comuna=05109, #vista=...): lleva a lo equivalente del sitio
     nuevo. La primera versión completa sigue en v1/. Las rutas son relativas: esta página está en la raíz del sitio. -->
<script>
  (function () {
    var p = new URLSearchParams(location.hash.slice(1));
    var comuna = p.get("comuna") || "";
    location.replace(
      /^\d{5}$/.test(comuna) ? "mapa/?comuna=" + comuna : p.has("vista") ? "v1/plataforma.html" + location.hash : "mapa/"
    );
  })();
</script>
